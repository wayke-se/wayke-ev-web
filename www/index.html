<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wayke EV Web</title>
    <link rel="stylesheet" href="build/dev.css" />
    <style>
      body {
        max-width: 560px;
        margin: 0 auto;
        padding: 24px 16px 96px;
        font-family: system-ui, sans-serif;
      }
      section {
        margin-top: 48px;
      }
      .note {
        color: #666;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <h1>Wayke EV Web</h1>
    <p class="note">Development page. Events are logged to the console.</p>

    <section>
      <p class="note">Sweden, by id</p>
      <div id="ev-se"></div>
    </section>
    <section>
      <p class="note">Norway, by id, with a theme</p>
      <div id="ev-no"></div>
    </section>
    <section>
      <p class="note">Figures passed in, in English</p>
      <div id="ev-data"></div>
    </section>
    <section>
      <p class="note">Unknown vehicle: nothing is shown below</p>
      <div id="ev-none"></div>
    </section>

    <script type="module" src="build/dev.js"></script>
  </body>
</html>
